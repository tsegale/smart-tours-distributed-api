server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: tour-core-service
  datasource:
    # Defaults match docker-compose's published port, so the service runs from your IDE too.
    url: ${TOURS_DB_URL:jdbc:postgresql://127.0.0.1:5433/tours}
    username: ${TOURS_DB_USER:tours}
    password: ${TOURS_DB_PASSWORD:change-me-tours}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:smarttours}
    password: ${RABBITMQ_PASSWORD:change-me-rabbit}
    listener:
      simple:
        # Listeners decide retry versus DLQ themselves (RetryingHandler). Anything that still escapes
        # is rejected without requeue, so it can't spin in a redelivery loop.
        default-requeue-rejected: false
  mvc:
    problemdetails:
      enabled: true
  jooq:
    sql-dialect: postgres
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # A cache that answers slower than the database is worse than none: give up quickly and fall through.
      timeout: 250ms
      connect-timeout: 250ms
  cache:
    type: redis
    # Created at start-up, so Micrometer binds their hit/miss metrics.
    cache-names: tour,search
    redis:
      enable-statistics: true

smarttours:
  messaging:
    max-retries: 5
    retry-delay: 10s
  search:
    # Search dates (from/to) are calendar days in this zone. Namibia is UTC+2 all year.
    zone: Africa/Windhoek

  # Outbound providers: timeouts and resilience policy per provider. The reasons for each value are in ADR 0012.
  # Base URLs are configurable so tests and the chaos compose profile can point them at WireMock.
  integrations:
    user-agent: "SmartTours/1.0 (tour-core-service; +https://github.com/tsegale/smart-tours-distributed-api)"
    # Daily background refresh, off the request path: patient timeouts and retries are cheap here.
    frankfurter:
      base-url: ${FRANKFURTER_BASE_URL:https://api.frankfurter.dev}
      connect-timeout: 2s
      read-timeout: 5s
      time-limit: 6s
      retry: { max-attempts: 4, initial-backoff: 2s, multiplier: 2, jitter: 0.5, max-backoff: 30s, max-retry-after: 60s }
      circuit-breaker: { sliding-window-size: 10, minimum-calls: 4, failure-rate-percent: 50, slow-call-threshold: 5s,
                         slow-call-rate-percent: 100, wait-in-open-state: 5m, permitted-calls-in-half-open-state: 1 }
      bulkhead: { max-threads: 1, queue-capacity: 2 }
    # On the request path (tour page): tight timeouts, one retry, a breaker that trips fast.
    open-meteo-forecast:
      base-url: ${OPEN_METEO_FORECAST_BASE_URL:https://api.open-meteo.com}
      connect-timeout: 500ms
      read-timeout: 1200ms
      time-limit: 1500ms
      retry: { max-attempts: 2, initial-backoff: 200ms, multiplier: 2, jitter: 0.5, max-backoff: 1s, max-retry-after: 1s }
      circuit-breaker: { sliding-window-size: 20, minimum-calls: 10, failure-rate-percent: 50, slow-call-threshold: 1s,
                         slow-call-rate-percent: 50, wait-in-open-state: 30s, permitted-calls-in-half-open-state: 3 }
      bulkhead: { max-threads: 8, queue-capacity: 16 }
    # Climate normals: ten small calls per miss, cached for 30 days, so rarely on the request path.
    open-meteo-archive:
      base-url: ${OPEN_METEO_ARCHIVE_BASE_URL:https://archive-api.open-meteo.com}
      connect-timeout: 500ms
      read-timeout: 2500ms
      time-limit: 3s
      retry: { max-attempts: 2, initial-backoff: 200ms, multiplier: 2, jitter: 0.5, max-backoff: 1s, max-retry-after: 1s }
      circuit-breaker: { sliding-window-size: 30, minimum-calls: 10, failure-rate-percent: 50, slow-call-threshold: 2s,
                         slow-call-rate-percent: 50, wait-in-open-state: 60s, permitted-calls-in-half-open-state: 3 }
      bulkhead: { max-threads: 4, queue-capacity: 40 }

# OpenAPI document and Swagger UI, served under the path the gateway publishes them at (route tour-docs),
# so every link in Swagger UI works through the gateway without path rewriting.
springdoc:
  api-docs:
    path: /docs/tours/v3/api-docs
  swagger-ui:
    path: /docs/tours/swagger-ui.html
  default-produces-media-type: application/json

management:
  # Redis only caches (ADR 0009): when it is down the service still answers from the database, so it
  # must not report itself unhealthy. Cache failures are counted in cache.errors.
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        # prometheus is for scraping on the internal network: the gateway routes no /actuator path here.
        include: health,info,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
