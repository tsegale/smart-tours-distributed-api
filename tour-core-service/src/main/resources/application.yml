server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  # Only the gateway can reach this service, so its X-Forwarded-* headers are trusted.
  forward-headers-strategy: framework

spring:
  application:
    name: tour-core-service
  datasource:
    # Defaults match docker-compose's published port, so the service runs from your IDE too.
    url: ${TOURS_DB_URL:jdbc:postgresql://127.0.0.1:5433/tours}
    username: ${TOURS_DB_USER:tours}
    password: ${TOURS_DB_PASSWORD:change-me-tours}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:smarttours}
    password: ${RABBITMQ_PASSWORD:change-me-rabbit}
    listener:
      simple:
        # Listeners decide retry versus DLQ themselves (RetryingHandler). Anything that still escapes
        # is rejected without requeue, so it can't spin in a redelivery loop.
        default-requeue-rejected: false
  mvc:
    problemdetails:
      enabled: true
  jooq:
    sql-dialect: postgres
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # A cache that answers slower than the database is worse than none: give up quickly and fall through.
      timeout: 250ms
      connect-timeout: 250ms
  cache:
    type: redis
    # Created at start-up, so Micrometer binds their hit/miss metrics.
    cache-names: tour,search
    redis:
      enable-statistics: true

smarttours:
  messaging:
    max-retries: 5
    retry-delay: 10s
  search:
    # Search dates (from/to) are calendar days in this zone. Namibia is UTC+2 all year.
    zone: Africa/Windhoek

# OpenAPI document and Swagger UI. Behind the gateway they live under /docs/tours (see the gateway
# route); X-Forwarded-Prefix from the gateway makes the generated links point there.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

management:
  # Redis only caches (ADR 0009): when it is down the service still answers from the database, so it
  # must not report itself unhealthy. Cache failures are counted in cache.errors.
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        # prometheus is for scraping on the internal network: the gateway routes no /actuator path here.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
