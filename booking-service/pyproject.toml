[project]
name = "booking-service"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Raised inside the Stripe SDK's own httpx call (form bodies passed as data=bytes), not by this code.
    "ignore:Use 'content=<...>' to upload raw bytes:DeprecationWarning:httpx",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic
