name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, tour-core-service]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests plus Testcontainers integration tests (Docker is available on GitHub runners).
      - run: ./mvnw -B -ntp verify
        working-directory: ${{ matrix.service }}

  booking-service:
    name: Python · booking-service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookings
          POSTGRES_PASSWORD: bookings
          POSTGRES_DB: bookings_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookings" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: booking-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: booking-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://bookings:bookings@localhost:5432/bookings_test

  ai-service:
    name: Python · ai-recommendation-service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai
          POSTGRES_PASSWORD: ai
          POSTGRES_DB: ai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ai" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ai-recommendation-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-recommendation-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ai:ai@localhost:5432/ai_test

  docker:
    name: Docker image · ${{ matrix.service }}
    needs: [java, booking-service, ai-service]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, tour-core-service, booking-service, ai-recommendation-service]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
