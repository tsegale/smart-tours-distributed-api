name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java · ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, tour-core-service]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests plus Testcontainers integration tests (Docker is available on GitHub runners): PostGIS,
      # RabbitMQ and Redis for tour-core, Redis for the gateway.
      - run: ./mvnw -B -ntp verify
        working-directory: ${{ matrix.service }}
      # The jOOQ classes are committed (docker build has no Docker daemon to generate them). Regenerate them
      # from the Flyway migrations in a throwaway PostGIS container and fail if anything differs.
      - name: jOOQ classes match the migrations
        if: matrix.service == 'tour-core-service'
        working-directory: tour-core-service
        run: |
          ./mvnw -B -ntp -Pjooq-codegen generate-sources
          # status, not diff: a new table shows up as an untracked file
          if [ -n "$(git status --porcelain -- src/main/generated)" ]; then
            git status --porcelain -- src/main/generated
            echo "::error::src/main/generated is stale: run ./mvnw -Pjooq-codegen generate-sources and commit"
            exit 1
          fi

  booking-service:
    name: Python · booking-service
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookings
          POSTGRES_PASSWORD: bookings
          POSTGRES_DB: bookings_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookings" --health-interval 5s --health-timeout 5s --health-retries 10
      # The outbox relay's publisher is tested against a real broker (publisher confirms).
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 10s --health-retries 12
    defaults:
      run:
        working-directory: booking-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: booking-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://bookings:bookings@localhost:5432/bookings_test
          TEST_RABBITMQ_URL: amqp://test:test@localhost:5672/%2F

  ai-service:
    name: Python · ai-recommendation-service
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai-recommendation-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-recommendation-service/requirements*.txt
      - name: Postgres with pgvector and PostGIS (the service's own image)
        working-directory: .
        run: |
          docker build -t smarttours/ai-db:ci infra/ai-db
          docker run -d --name ai-db -p 5432:5432 -e POSTGRES_USER=ai -e POSTGRES_PASSWORD=ai -e POSTGRES_DB=ai_test \
            --health-cmd "pg_isready -U ai" --health-interval 3s smarttours/ai-db:ci
          for _ in $(seq 40); do [ "$(docker inspect -f '{{.State.Health.Status}}' ai-db)" = healthy ] && break; sleep 3; done
          docker exec ai-db psql -U ai -d ai_test -c "CREATE DATABASE ai_gate"
          docker run -d --name redis -p 6379:6379 redis:7.4-alpine
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ai:ai@localhost:5432/ai_test
          TEST_REDIS_URL: redis://localhost:6379/15
      # Retrieval quality against the committed baseline: a cached ONNX model and no paid API.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('ai-recommendation-service/eval/baseline.json', 'ai-recommendation-service/app/embeddings.py') }}
      - name: Retrieval quality gate
        env:
          DATABASE_URL: postgresql+psycopg://ai:ai@localhost:5432/ai_gate
        run: alembic upgrade head && python -m eval.regression

  # The tests need WeasyPrint's system libraries, so they run in the service's own test image, against the same
  # compose services as locally (Postgres, RabbitMQ with the celery vhost, MinIO with its users, Mailpit).
  notification-service:
    name: Python · notification-service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint
        working-directory: notification-service
        run: pip install ruff==0.17.3 && ruff check . && ruff format --check .
      - name: Infrastructure (compose, notifications profile)
        run: |
          cp .env.example .env
          pip install cryptography==50.0.2 && python scripts/ticket_keys.py
          docker compose --profile notifications up -d --wait notifications-db rabbitmq mailpit minio
          docker compose --profile notifications up --exit-code-from minio-setup minio-setup
          docker compose --profile notifications up --exit-code-from rabbitmq-setup rabbitmq-setup
          docker compose exec -T notifications-db psql -U notifications -d notifications -c "CREATE DATABASE notifications_test"
      - name: Tests
        run: |
          docker build --target test -t notification-service:test notification-service
          set -a; . ./.env; set +a
          docker run --rm --network "$(basename "$PWD")_default" -v "$PWD/docs:/docs:ro"             -e TEST_DATABASE_URL="postgresql+psycopg://notifications:$NOTIFICATIONS_DB_PASSWORD@notifications-db:5432/notifications_test"             -e TEST_RABBITMQ_URL="amqp://$RABBITMQ_USER:$RABBITMQ_PASSWORD@rabbitmq:5672/%2F"             -e TEST_CELERY_BROKER_URL="amqp://$RABBITMQ_USER:$RABBITMQ_PASSWORD@rabbitmq:5672/celery"             -e TEST_S3_ENDPOINT_URL=http://minio:9000 -e TEST_S3_ACCESS_KEY="$MINIO_ROOT_USER" -e TEST_S3_SECRET_KEY="$MINIO_ROOT_PASSWORD"             -e TEST_SMTP_HOST=mailpit -e TEST_SMTP_PORT=1025 -e TEST_MAILPIT_URL=http://mailpit:8025             notification-service:test
      - if: failure()
        run: docker compose --profile notifications logs --tail 100

  compose:
    name: docker compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Catches broken interpolation or references before anyone runs the stack.
      # .env.example has placeholder values for every required variable.
      - run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile payments config --quiet
          docker compose --profile ai config --quiet
          docker compose --profile auth config --quiet
          docker compose --profile observability --env-file .env --env-file infra/observability/observability.env config --quiet
          docker compose --profile notifications --profile flower config --quiet
          docker compose --profile chaos --env-file .env --env-file infra/chaos/chaos.env config --quiet
          # The default profile must stay the core only: the optional pieces may not leak into it.
          for s in otel-lgtm keycloak keycloak-db ai-service ai-worker notification-service minio mailpit flower; do
            if docker compose config --services | grep -qx "$s"; then echo "::error::$s is in the default profile"; exit 1; fi
          done
      # The chaos stubs must be valid WireMock mappings: load them into the same image and list them.
      - name: chaos stubs load in WireMock
        run: |
          docker run -d --name stubs -p 8090:8080 -v "$PWD/infra/chaos/wiremock:/home/wiremock:ro" \
            wiremock/wiremock:3.13.2 --global-response-templating
          for _ in $(seq 30); do curl -sf localhost:8090/__admin/health >/dev/null && break; sleep 1; done
          test "$(curl -s localhost:8090/__admin/mappings | python3 -c 'import sys,json; print(json.load(sys.stdin)["meta"]["total"])')" = 12
          python3 scripts/chaos.py all slow && python3 scripts/chaos.py status | grep -c slow | grep -qx 2
          docker rm -f stubs

  # The stack as a user starts it. Unit and integration tests can't see a broken compose file or env wiring: an empty
  # variable once stopped tour-core from starting while every test passed.
  default-stack:
    name: Default stack starts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configuration
        run: |
          sed -e 's/change-me[^ ]*/ci-only-value/' .env.example > .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          python3 -m pip install -q cryptography
          python3 scripts/ticket_keys.py
      - run: docker compose up -d --wait --build
      - name: A search through the gateway
        run: |
          token=$(python3 scripts/dev_token.py --sub ci)
          curl -fsS -H "Authorization: Bearer $token" "http://127.0.0.1:8080/api/tours/search?size=1" >/dev/null
      - if: failure()
        run: docker compose logs --tail 60

  # Secrets in the whole history, not just this push. Reviewed findings are in .gitleaksignore.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore

  docker:
    name: Docker image · ${{ matrix.service }}
    needs: [java, booking-service, ai-service, notification-service]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, tour-core-service, booking-service, ai-recommendation-service, notification-service, infra/keycloak, infra/ai-db]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: image
        run: echo "name=smarttours/$(basename '${{ matrix.service }}'):ci" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: false
          load: true # into the local daemon, for the scan and the SBOM
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Third-party actions with access to the job are pinned by commit, not by a tag that can be moved.
      - name: Scan the image (fails on a CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}
          version: v0.76.1
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}
          format: spdx-json
          artifact-name: sbom-${{ strategy.job-index }}.spdx.json
          upload-release-assets: false
