# Smart Tours: local stack.
#
#   cp .env.example .env      # then edit the secrets
#   python scripts/ticket_keys.py   # once: the check-in token key pair (secrets/, git-ignored)
#   docker compose up --build       # the core: gateway, tour-core, booking, their stores
#
# Optional pieces are profiles, so the default stays usable on an 8 GB laptop (README, "Profiles"):
#   --profile auth            real tokens from Keycloak (keycloak, keycloak-db; python scripts/keycloak_secrets.py first)
#   --profile ai              recommendations (ai-service, ai-worker, ai-db): about 1 GB more
#   --profile notifications   emails, PDF tickets, check-in (notification-*, MinIO, Mailpit)
#   --profile flower          Celery's Flower dashboard (with notifications)
#   --profile payments        Stripe CLI webhook forwarding (Stripe test mode)
#   --profile chaos           WireMock provider stubs (with infra/chaos/chaos.env)
#
# Only the API gateway (8080) and the RabbitMQ management UI (15672) are meant to be
# called from outside. Databases are published on 127.0.0.1 only, for local tooling.
# The application services are reachable only inside the compose network, so every
# request has to go through the gateway, which authenticates it and sets X-User-Id.
# Every container has a memory limit; docs/benchmarks/notifications.md records what they use.

x-db-healthcheck: &db-healthcheck
  interval: 5s
  timeout: 5s
  retries: 20

services:
  # ---------------------------------------------------------------- data stores
  tours-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: tours
      POSTGRES_USER: ${TOURS_DB_USER:?set TOURS_DB_USER in .env}
      POSTGRES_PASSWORD: ${TOURS_DB_PASSWORD:?set TOURS_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5433:5432"]
    volumes: [tours_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tours"]
      <<: *db-healthcheck
    deploy:
      resources:
        limits:
          memory: 512M # PostGIS, the 100k-tour seed and search's working set
    restart: unless-stopped

  bookings-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: ${BOOKINGS_DB_USER:?set BOOKINGS_DB_USER in .env}
      POSTGRES_PASSWORD: ${BOOKINGS_DB_PASSWORD:?set BOOKINGS_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5434:5432"]
    volumes: [bookings_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d bookings"]
      <<: *db-healthcheck
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  ai-db:
    image: pgvector/pgvector:pg16
    profiles: [ai]
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ${AI_DB_USER:?set AI_DB_USER in .env}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD:?set AI_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5435:5432"]
    volumes: [ai_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ai"]
      <<: *db-healthcheck
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # Rate-limit token buckets (gateway). Default policy: never evicts, so a bucket can't vanish under pressure.
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck: &redis-healthcheck
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  # tour-core's catalogue cache: bounded, evicts least recently used keys, nothing persisted (it's a cache).
  # Separate from the limiter's Redis so cache pressure or a cache flush never touches rate-limit state.
  redis-cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6380:6379"]
    healthcheck: *redis-healthcheck
    deploy:
      resources:
        limits:
          memory: 192M # maxmemory 128mb of data, plus Redis' own overhead
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"   # AMQP, for running services from your IDE
      - "127.0.0.1:15672:15672" # management UI
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M # RabbitMQ blocks publishers at 40% of this (its memory high watermark)
    restart: unless-stopped

  # ---------------------------------------------------------------- services
  # Memory limits matter for the JVMs: MaxRAMPercentage=75 sizes the heap from the container
  # limit, and without one each JVM would size itself from the whole host or VM.
  api-gateway:
    build: ./api-gateway
    environment:
      # Who the gateway accepts tokens from (ADR 0016). Dev tokens are for local use; the prod profile refuses them.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DEV_TOKENS_ENABLED: ${DEV_TOKENS_ENABLED:-true}
      # iss as clients see it, keys over the internal network. Keys are fetched on first use, so without the auth
      # profile the gateway still starts; a Keycloak token just answers 503.
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}/realms/smart-tours
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/smart-tours/protocol/openid-connect/certs
      TOUR_SERVICE_URL: http://tour-core-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8082
      AI_SERVICE_URL: http://ai-service:8083
      # Token buckets for rate limiting (ADR 0010). Budgets: RATE_LIMIT_* in .env.example.
      REDIS_HOST: redis
      RATE_LIMIT_SEARCH_RPS: ${RATE_LIMIT_SEARCH_RPS:-20}
      RATE_LIMIT_SEARCH_BURST: ${RATE_LIMIT_SEARCH_BURST:-40}
      RATE_LIMIT_USER_RPS: ${RATE_LIMIT_USER_RPS:-10}
      RATE_LIMIT_USER_BURST: ${RATE_LIMIT_USER_BURST:-20}
      RATE_LIMIT_ANONYMOUS_RPS: ${RATE_LIMIT_ANONYMOUS_RPS:-5}
      RATE_LIMIT_ANONYMOUS_BURST: ${RATE_LIMIT_ANONYMOUS_BURST:-10}
      RATE_LIMIT_BOOKING_RPS: ${RATE_LIMIT_BOOKING_RPS:-1}
      RATE_LIMIT_BOOKING_BURST: ${RATE_LIMIT_BOOKING_BURST:-5}
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
      start_interval: 2s
    depends_on:
      redis: { condition: service_healthy }
      tour-core-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
      ai-service: { condition: service_started, required: false } # profile ai; without it, 503 on /api/recommendations
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  tour-core-service:
    build: ./tour-core-service
    environment:
      TOURS_DB_URL: jdbc:postgresql://tours-db:5432/tours
      TOURS_DB_USER: ${TOURS_DB_USER}
      TOURS_DB_PASSWORD: ${TOURS_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # Catalogue cache (ADR 0009). Optional at runtime: without Redis, reads go to the database.
      REDIS_HOST: redis-cache
      # Outbound providers (ADRs 0011, 0012). The chaos profile points these at provider-stubs.
      FRANKFURTER_BASE_URL: ${FRANKFURTER_BASE_URL:-https://api.frankfurter.dev}
      OPEN_METEO_FORECAST_BASE_URL: ${OPEN_METEO_FORECAST_BASE_URL:-https://api.open-meteo.com}
      OPEN_METEO_ARCHIVE_BASE_URL: ${OPEN_METEO_ARCHIVE_BASE_URL:-https://archive-api.open-meteo.com}
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
      FX_FRESH_DAYS: ${FX_FRESH_DAYS:-4}
      FX_MAX_AGE_DAYS: ${FX_MAX_AGE_DAYS:-14}
      FX_MAX_MOVE_PERCENT: ${FX_MAX_MOVE_PERCENT:-10}
      FX_PEG_TOLERANCE_PERCENT: ${FX_PEG_TOLERANCE_PERCENT:-0.5}
      FX_REFRESH_CRON: ${FX_REFRESH_CRON:-0 15 18 * * *}
      FX_REFRESH_ON_STARTUP: ${FX_REFRESH_ON_STARTUP:-true}
      WEATHER_INCLUDE_BUDGET: ${WEATHER_INCLUDE_BUDGET:-400ms}
      WEATHER_REQUEST_BUDGET: ${WEATHER_REQUEST_BUDGET:-3s}
      ACTUATOR_ACCESS_MAX_PERMITTED: ${ACTUATOR_ACCESS_MAX_PERMITTED:-read-only}
      # Warm-up before readiness (sends its own hot requests to itself first). false for a quicker local start.
      WARM_UP_ENABLED: ${WARM_UP_ENABLED:-true}
    depends_on:
      tours-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis-cache: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  booking-service:
    build: ./booking-service
    image: smarttours/booking-service:local # built once, reused by booking-sweeper
    environment: &booking-env
      DATABASE_URL: postgresql+psycopg://${BOOKINGS_DB_USER}:${BOOKINGS_DB_PASSWORD}@bookings-db:5432/bookings
      # Price snapshots: called directly on the internal network, not through the gateway.
      TOUR_SERVICE_URL: http://tour-core-service:8081
      # fake (default, no account needed) or stripe (test mode: see docs/smoke-test.md).
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # Required for both providers: the fake one verifies Stripe-format signatures too.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET in .env}
      CHECKOUT_SUCCESS_URL: ${CHECKOUT_SUCCESS_URL:-http://localhost:3000/bookings/{booking_id}?checkout=success}
      CHECKOUT_CANCEL_URL: ${CHECKOUT_CANCEL_URL:-http://localhost:3000/bookings/{booking_id}?checkout=cancelled}
      HOLD_MINUTES: ${HOLD_MINUTES:-30}
      CANCELLATION_FULL_REFUND_HOURS: ${CANCELLATION_FULL_REFUND_HOURS:-48}
      RESERVATION_STRATEGY: ${RESERVATION_STRATEGY:-atomic}
      # uvicorn worker processes (it reads WEB_CONCURRENCY). One worker is a single Python
      # process, and the benchmark showed it saturating one core long before the database.
      # Connections: workers x (pool + overflow) = 4 x 15 = 60, under Postgres' default of 100.
      WEB_CONCURRENCY: ${BOOKING_WEB_CONCURRENCY:-4}
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 10
      # Only the outbox relay and the ticket listener connect to the broker; the API writes events to the outbox.
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      # Tickets (ADR 0015): presigned downloads with a read-only MinIO user, signed for the URL the browser uses,
      # and check-in tokens verified with notification-service's public keys (JWKS, by kid). Without the
      # notifications profile, downloads and check-in answer 503.
      TICKETS_S3_PUBLIC_ENDPOINT_URL: ${TICKETS_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      TICKETS_S3_ACCESS_KEY: tickets-reader
      TICKETS_S3_SECRET_KEY: ${TICKETS_READER_SECRET_KEY:-}
      TICKET_JWKS_URL: http://notification-service:8084/.well-known/jwks.json
    depends_on:
      bookings-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://localhost:8082/health').status != 200)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768M # 4 workers
    restart: unless-stopped

  # Same image, different process: expires unpaid holds every 60 s and retries pending refunds.
  # Safe to scale (SELECT ... FOR UPDATE SKIP LOCKED; see app/services/sweeper.py).
  booking-sweeper:
    image: smarttours/booking-service:local
    pull_policy: never # local image from booking-service's build
    command: ["python", "-m", "app.jobs.expire_holds"]
    environment: *booking-env
    volumes: []
    depends_on:
      booking-service: { condition: service_healthy } # runs the migrations
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # Same image, different process: publishes committed outbox rows to RabbitMQ (ADR 0008).
  # Safe to scale (SELECT ... FOR UPDATE SKIP LOCKED; see app/services/outbox_relay.py).
  booking-outbox-relay:
    image: smarttours/booking-service:local
    pull_policy: never # local image from booking-service's build
    command: ["python", "-m", "app.jobs.outbox_relay"]
    environment: *booking-env
    volumes: []
    depends_on:
      booking-service: { condition: service_healthy } # runs the migrations
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # Same image, different process: records ticket.rendered events, so booking-service knows where each ticket is
  # without reading notification-service's database (ADR 0015). Only useful with the notifications profile.
  booking-ticket-listener:
    image: smarttours/booking-service:local
    pull_policy: never
    profiles: [notifications]
    command: ["python", "-m", "app.jobs.ticket_listener"]
    environment: *booking-env
    volumes: []
    depends_on:
      booking-service: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  # Stripe test mode only: docker compose --profile payments up
  # Forwards Stripe events to booking-service. Its signing secret (whsec_...) goes into
  # STRIPE_WEBHOOK_SECRET in .env; see docs/smoke-test.md.
  stripe-cli:
    image: stripe/stripe-cli:v1.55.3
    profiles: [payments]
    command:
      - listen
      - --api-key=${STRIPE_SECRET_KEY:-}
      - --forward-to=booking-service:8082/webhooks/stripe
      - --events=checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired
    depends_on:
      booking-service: { condition: service_healthy }
    restart: unless-stopped

  # Chaos testing only: docker compose --profile chaos --env-file .env --env-file infra/chaos/chaos.env up -d
  # WireMock standing in for Frankfurter and Open-Meteo, with a switchable fault per provider
  # (python scripts/chaos.py <fx|weather|all> <healthy|slow|errors|dead>). docs/smoke-test.md section 9.
  provider-stubs:
    image: wiremock/wiremock:3.13.2
    profiles: [chaos]
    command: ["--global-response-templating", "--no-request-journal", "--disable-banner"]
    # An explicit heap: at a 256M limit and the JVM's default heap the container hit its limit hundreds of times
    # under the integrations benchmark and thrashed (memory.events), so the stand-in provider became the slow one.
    environment:
      JAVA_OPTS: "-Xmx192m -XX:MaxMetaspaceSize=96m"
    volumes: ["./infra/chaos/wiremock:/home/wiremock:ro"]
    ports: ["127.0.0.1:8090:8080"] # admin API for scripts/chaos.py
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  ai-service:
    build: ./ai-recommendation-service
    image: smarttours/ai-recommendation-service:local # built once, reused by ai-worker
    profiles: [ai]
    environment: &ai-env
      DATABASE_URL: postgresql+psycopg://${AI_DB_USER}:${AI_DB_PASSWORD}@ai-db:5432/ai
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      HF_HOME: /models
    volumes: [hf_models:/models]
    depends_on:
      ai-db: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 1536M # torch + the embedding model
    restart: unless-stopped

  # Same image, different process: consumes tour events and writes embeddings.
  # Scales independently of the HTTP API (docker compose up --scale ai-worker=3).
  ai-worker:
    image: smarttours/ai-recommendation-service:local
    profiles: [ai]
    pull_policy: never # local image from ai-service's build; a second build: would rebuild torch for nothing
    command: ["python", "-m", "app.worker"]
    environment: *ai-env
    volumes: [hf_models:/models]
    depends_on:
      ai-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      ai-service: { condition: service_started } # runs the migrations
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped

  # ---------------------------------------------------------------- identity (profile)
  # python scripts/keycloak_secrets.py, once; then docker compose --profile auth up -d (ADR 0016).
  # Its own database, like every other service.
  keycloak-db:
    image: postgres:16-alpine
    profiles: [auth]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
    env_file:
      - path: ./secrets/keycloak-db.env
        required: false # only read with this profile, and then the database refuses to start without a password
    volumes: [keycloak_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d keycloak"]
      <<: *db-healthcheck
    deploy:
      resources:
        limits:
          memory: 192M
    restart: unless-stopped

  # Built with --optimized in mind (infra/keycloak/Dockerfile). The realm is code; it is imported on the first start
  # only, and an existing realm is left alone, so changes to the file need: docker compose down keycloak-db -v
  keycloak:
    build: ./infra/keycloak
    image: smarttours/keycloak:local
    profiles: [auth]
    command: ["start", "--optimized", "--import-realm"]
    env_file:
      - path: ./secrets/keycloak.env
        required: false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      # The public URL: it becomes the iss in every token. TLS belongs in front of this in production.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_WEB_ORIGIN: ${KEYCLOAK_WEB_ORIGIN:-http://localhost:3000}
    volumes: ["./infra/keycloak/realm:/opt/keycloak/data/import:ro"]
    ports: ["127.0.0.1:8180:8080"]
    healthcheck:
      # The image has no curl or wget. Health is on the management port, not the public one.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
      start_interval: 3s
    depends_on:
      keycloak-db: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # ---------------------------------------------------------------- notifications (profile)
  # docker compose --profile notifications up -d: booking emails with PDF tickets (ADRs 0014, 0015).
  notifications-db:
    image: postgres:16-alpine
    profiles: [notifications]
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: ${NOTIFICATIONS_DB_USER:-notifications}
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-}
    ports: ["127.0.0.1:5436:5432"]
    volumes: [notifications_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d notifications"]
      <<: *db-healthcheck
    deploy:
      resources:
        limits:
          memory: 192M
    restart: unless-stopped

  # Celery's broker is this RabbitMQ, on a vhost of its own: task messages never share a vhost with domain events.
  # One-shot: creates the vhost and grants the app user on it, through the management API (idempotent PUTs).
  rabbitmq-setup:
    image: curlimages/curl:8.22.0
    profiles: [notifications]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        curl -fsS --retry 30 --retry-connrefused --retry-delay 2 -u "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD"
        -X PUT http://rabbitmq:15672/api/vhosts/celery &&
        curl -fsS --retry 5 -u "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD" -X PUT -H 'content-type: application/json'
        -d '{"configure":".*","write":".*","read":".*"}' "http://rabbitmq:15672/api/permissions/celery/$$RABBITMQ_USER" &&
        echo "vhost celery ready"
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: "no"

  # S3-compatible object storage for ticket PDFs. MinIO stopped publishing community images in October 2025;
  # this is Chainguard's build of current MinIO source (with a shell, for the healthcheck), pinned by digest.
  minio:
    image: cgr.dev/chainguard/minio:latest-dev@sha256:6d4f84fa90a51955476b23d9bc3bc371d60835c59d1b36826169e0392c2b57a2
    profiles: [notifications]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smarttours-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    # 9000: presigned ticket downloads go straight from the browser to here. 9001: the MinIO console.
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped

  # One-shot: the private tickets bucket and two least-privilege users, one that writes (notification-service)
  # and one that only reads (booking-service, which presigns downloads). Idempotent.
  minio-setup:
    image: cgr.dev/chainguard/minio-client:latest-dev@sha256:39768db4c3fa811bc8f2e2a3e0add8ea391648b1c980de179985e1c353dc1805
    profiles: [notifications]
    entrypoint: ["sh", "/setup/minio-setup.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smarttours-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      TICKETS_WRITER_SECRET_KEY: ${TICKETS_WRITER_SECRET_KEY:-}
      TICKETS_READER_SECRET_KEY: ${TICKETS_READER_SECRET_KEY:-}
    volumes: ["./infra/minio:/setup:ro"]
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  # SMTP sink with a web UI and an API (tests assert on it): http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    profiles: [notifications]
    environment:
      MP_ENABLE_CHAOS: "true" # SMTP failures on demand, through its API (docs/smoke-test.md, tests)
      MP_MAX_MESSAGES: "5000"
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  # One image, four processes: the API (health, metrics, admin), the event bridge, Celery workers and Beat.
  notification-service:
    build: ./notification-service
    image: smarttours/notification-service:local
    profiles: [notifications]
    environment: &notification-env
      DATABASE_URL: postgresql+psycopg://${NOTIFICATIONS_DB_USER:-notifications}:${NOTIFICATIONS_DB_PASSWORD:-}@notifications-db:5432/notifications
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2F
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/celery
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: tickets-writer
      S3_SECRET_KEY: ${TICKETS_WRITER_SECRET_KEY:-}
      TICKET_SIGNING_KEY_FILE: /run/secrets/ticket_signing_key
      # Public keys only: the API publishes them as a JWKS, the render worker checks its key is among them.
      TICKET_PUBLIC_KEYS_DIR: /run/ticket-keys
      SEND_RATE_LIMIT: ${NOTIFICATIONS_SEND_RATE_LIMIT:-10/s}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://localhost:8084/health').status != 200)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes: ["./secrets/ticket-public:/run/ticket-keys:ro"]
    depends_on:
      notifications-db: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 160M
    restart: unless-stopped

  notification-bridge:
    image: smarttours/notification-service:local
    pull_policy: never
    profiles: [notifications]
    command: ["python", "-m", "app.bridge"]
    environment: *notification-env
    depends_on:
      notification-service: { condition: service_healthy } # runs the migrations
      rabbitmq-setup: { condition: service_completed_successfully }
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  # Renders PDF tickets: the render queue only. Prefork pool; NOTIFICATION_WORKER_CONCURRENCY processes (the
  # benchmark compares 1 and 2). Scale out with --scale notification-worker=N. The only reader of the signing key.
  notification-worker:
    image: smarttours/notification-service:local
    pull_policy: never
    profiles: [notifications]
    command: ["sh", "-c", "exec celery -A app.celery_app worker --hostname=render@%h --queues=$${CELERY_TASK_QUEUE:-notifications.tasks}.render --loglevel=INFO --concurrency=$${NOTIFICATION_WORKER_CONCURRENCY:-2} --max-memory-per-child=200000"]
    environment:
      <<: *notification-env
      NOTIFICATION_WORKER_CONCURRENCY: ${NOTIFICATION_WORKER_CONCURRENCY:-2}
    secrets: [ticket_signing_key]
    volumes: ["./secrets/ticket-public:/run/ticket-keys:ro"]
    depends_on:
      notification-service: { condition: service_healthy }
      rabbitmq-setup: { condition: service_completed_successfully }
      minio-setup: { condition: service_completed_successfully }
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # Sends email (its own queue, so emails never wait behind a render backlog) and runs Beat's short jobs.
  notification-email-worker:
    image: smarttours/notification-service:local
    pull_policy: never
    profiles: [notifications]
    command: ["sh", "-c", "exec celery -A app.celery_app worker --hostname=email@%h --queues=$${CELERY_TASK_QUEUE:-notifications.tasks}.email,$${CELERY_TASK_QUEUE:-notifications.tasks} --loglevel=INFO --concurrency=$${NOTIFICATION_EMAIL_WORKER_CONCURRENCY:-2} --max-memory-per-child=150000"]
    environment:
      <<: *notification-env
      NOTIFICATION_EMAIL_WORKER_CONCURRENCY: ${NOTIFICATION_EMAIL_WORKER_CONCURRENCY:-2}
    depends_on:
      notification-service: { condition: service_healthy }
      rabbitmq-setup: { condition: service_completed_successfully }
      minio-setup: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped

  # Beat must be a singleton: two schedulers enqueue every job twice. The tasks are idempotent (a second reminder
  # run creates nothing), so a brief overlap during a deploy is harmless, but don't scale this service.
  notification-beat:
    image: smarttours/notification-service:local
    pull_policy: never
    profiles: [notifications]
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *notification-env
    depends_on:
      notification-service: { condition: service_healthy }
      rabbitmq-setup: { condition: service_completed_successfully }
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  # Celery's dashboard: http://localhost:5555 (with --profile notifications --profile flower).
  flower:
    image: smarttours/notification-service:local
    pull_policy: never
    profiles: [flower]
    command: ["sh", "-c", "exec celery -A app.celery_app flower --port=5555 --broker_api=http://$$RABBITMQ_USER:$$RABBITMQ_PASSWORD@rabbitmq:15672/api/ --basic-auth=$$FLOWER_BASIC_AUTH"]
    environment:
      <<: *notification-env
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-}
    ports: ["127.0.0.1:5555:5555"]
    depends_on:
      rabbitmq-setup: { condition: service_completed_successfully }
    deploy:
      resources:
        limits:
          memory: 160M
    restart: unless-stopped

# The check-in token's private key: only the worker that renders tickets reads it. python scripts/ticket_keys.py
secrets:
  ticket_signing_key:
    file: ./secrets/ticket-signing/ticket_signing_key.pem

volumes:
  tours_data:
  bookings_data:
  ai_data:
  rabbitmq_data:
  hf_models:
  notifications_data:
  minio_data:
  keycloak_data:
